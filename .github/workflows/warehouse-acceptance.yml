name: Credentialed staging acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warehouse-staging
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Run isolated warehouse acceptance
        env:
          NODE_ENV: production
          APP_MODE: snowflake
          PUBLIC_ORIGIN: https://staging.example.com
          STATE_DIR: ${{ runner.temp }}/snowstack-state
          DBT_PACKAGES_INSTALL_PATH: ${{ runner.temp }}/dbt-packages
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_READER_ROLE: ${{ vars.SNOWFLAKE_READER_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SOURCE_SCHEMA: BRONZE
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          CUSTOMER_KEY_SALT: ${{ secrets.CUSTOMER_KEY_SALT }}
          DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        shell: bash
        run: |
          umask 077
          export SNOWFLAKE_PRIVATE_KEY_PATH="$RUNNER_TEMP/warehouse-key.p8"
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$SNOWFLAKE_PRIVATE_KEY_PATH"
          unset SNOWFLAKE_PRIVATE_KEY
          dbt deps --profiles-dir config
          npm run warehouse:acceptance
