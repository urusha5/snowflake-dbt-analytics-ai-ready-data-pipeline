name: Validate pipeline and application
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  dbt:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      DBT_PACKAGES_INSTALL_PATH: ${{ runner.temp }}/dbt-packages
      SNOWFLAKE_ACCOUNT: offline_validation
      SNOWFLAKE_USER: offline_validation
      SNOWFLAKE_PASSWORD: not-a-real-password
      CUSTOMER_KEY_SALT: offline-validation-only-salt-with-more-than-32-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip check
      - run: python -m pip install -r requirements-ci.txt
      - run: pip-audit --requirement requirements.lock --disable-pip --no-deps
      - run: dbt deps --profiles-dir config
      - run: >-
          dbt parse --profiles-dir config --target prod --no-partial-parse --vars '{feature_as_of_date: "2026-10-29", source_loaded_at_field: loaded_at, customer_created_at_field: created_at, product_available_from_field: available_from}'
      - run: python scripts/validate_sql.py
  container:
    runs-on: ubuntu-latest
    needs: [application, dbt]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t snowstack:ci .
      - name: Validate compose and proxy configuration
        env:
          SNOWSTACK_IMAGE: snowstack:ci
          CADDY_IMAGE: caddy:2-alpine
        run: |
          cp deploy/web.env.example deploy/web.env
          cp deploy/worker.env.example deploy/worker.env
          cp deploy/proxy.env.example deploy/proxy.env
          mkdir -p deploy/secrets
          touch deploy/secrets/reader.p8 deploy/secrets/reader-passphrase deploy/secrets/worker.p8 deploy/secrets/worker-passphrase deploy/secrets/oidc-client-secret deploy/secrets/customer-key-salt
          docker compose -f deploy/compose.yml config --quiet
          docker run --rm -e PUBLIC_HOST=data.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Verify production refuses missing configuration
        run: |
          if docker run --rm snowstack:ci; then
            echo "Production started without required configuration"
            exit 1
          fi
      - name: Verify container runtime with isolated demo fixtures
        run: |
          docker run -d --name snowstack-test --tmpfs /tmp -e NODE_ENV=development -e APP_MODE=demo -e HOST=127.0.0.1 -e STATE_DIR=/tmp/snowstack snowstack:ci
          for attempt in 1 2 3 4 5; do
            if docker exec snowstack-test node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 2
          done
          docker logs snowstack-test
          exit 1
