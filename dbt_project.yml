name: 'snowflake_dbt_ai_pipeline'
version: '3.0.0'
config-version: 2

profile: 'snowflake_dbt_ai_pipeline'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  feature_as_of_date: ''
  incremental_lookback_days: 7
  source_loaded_at_field: null
  customer_created_at_field: null
  product_available_from_field: null

on-run-start:
  - "{{ validate_production() }}"

models:

  snowflake_dbt_ai_pipeline:

    staging:
      +materialized: view
      +tags:
        - staging

    silver:
      +materialized: view
      +tags:
        - silver

    gold:
      +materialized: table
      +tags:
        - gold

    ai:
      +materialized: table
      +tags: [ai_ready]
      +meta:
        owner: AI Engineering
        contains_direct_pii: false
      +contract:
        enforced: true

snapshots:

  snowflake_dbt_ai_pipeline:
    +target_schema: snapshots

seeds:

  snowflake_dbt_ai_pipeline:
    +quote_columns: false
