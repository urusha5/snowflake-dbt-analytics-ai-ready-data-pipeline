# Environment references only. Never put credentials in this file.
snowflake_dbt_ai_pipeline:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'PACIFIC_RETAIL_DB') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS') }}"
      threads: 4
      client_session_keep_alive: false
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: snowflake_jwt
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/run/secrets/snowflake_key') }}"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SNOWSTACK_TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'SNOWSTACK_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'PACIFIC_RETAIL_DB') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS_VALIDATION') }}"
      threads: 4
      query_tag: "{{ env_var('SNOWSTACK_QUERY_TAG', 'snowstack_production') }}"
      connect_timeout: 15
      connect_retries: 1
      client_session_keep_alive: false
